<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ウェブマーケティング単語帳</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #3166A3;
      --primary-dark: #254f82;
      --secondary: #FF7BAC;
      --success: #3166A3;
      --danger: #ef4444;
      --bg: #F8F8FB;
      --card-bg: #ffffff;
      --text: #1A1A1C;
      --text-muted: #5a6a7a;
      --border: #d8e3ee;
      --shadow: 0 4px 24px rgba(49,102,163,0.12);
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: linear-gradient(135deg, #254f82, #3166A3);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(49,102,163,0.35);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #fff;
      padding: 3px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; }
    header .subtitle { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }

    .stats-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 0.85rem;
    }
    .stat { background: rgba(255,255,255,0.2); border-radius: 999px; padding: 4px 12px; }

    main {
      width: 100%;
      max-width: 680px;
      padding: 24px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Category filter */
    .category-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }
    .cat-btn {
      border: none;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      background: var(--border);
      color: var(--text-muted);
      font-weight: 600;
      transition: all 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    /* Progress */
    .progress-wrap {
      width: 100%;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3166A3, #FF7BAC);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* Flashcard */
    .card-scene {
      width: 100%;
      height: 260px;
      perspective: 1000px;
      cursor: pointer;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
      border-radius: 20px;
    }
    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 28px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: var(--shadow);
    }
    .card-front {
      background: var(--card-bg);
      border: 2px solid var(--border);
    }
    .card-back {
      background: linear-gradient(135deg, #EEF3FA, #F8F8FB);
      transform: rotateY(180deg);
    }

    .card-badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--primary-dark);
      text-transform: uppercase;
      margin-bottom: 12px;
      background: #dce8f5;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .card-back .card-badge {
      background: rgba(255,255,255,0.7);
      color: var(--primary-dark);
    }

    .card-term {
      font-size: 1.9rem;
      font-weight: 800;
      text-align: center;
      color: var(--text);
      line-height: 1.3;
    }
    .card-hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-def {
      font-size: 1.05rem;
      font-weight: 600;
      text-align: left;
      color: var(--primary-dark);
      line-height: 1.6;
    }
    .card-example {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: left;
      line-height: 1.5;
      background: rgba(255,255,255,0.5);
      padding: 8px 14px;
      border-radius: 10px;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn {
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-nav {
      background: var(--card-bg);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 10px 22px;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .btn-nav:hover:not(:disabled) { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-nav:disabled { opacity: 0.35; cursor: not-allowed; }

    .card-counter {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 64px;
      text-align: center;
    }

    /* Reaction buttons */
    .reaction-row {
      display: flex;
      gap: 12px;
    }
    .btn-reaction {
      padding: 10px 24px;
      font-size: 0.9rem;
      border-radius: 999px;
    }
    .btn-known {
      background: var(--success);
      color: #fff;
    }
    .btn-known:hover { background: #254f82; transform: translateY(-1px); }
    .btn-unknown {
      background: var(--danger);
      color: #fff;
    }
    .btn-unknown:hover { background: #dc2626; transform: translateY(-1px); }

    /* Shuffle / Reset */
    .action-row {
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      background: var(--card-bg);
      border: 2px solid var(--border);
      color: var(--text-muted);
      padding: 8px 18px;
      font-size: 0.8rem;
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

    /* Result modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    .modal h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .modal .score { font-size: 3rem; font-weight: 900; color: var(--primary); margin: 16px 0; }
    .modal p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
    .btn-modal { background: var(--primary); color: #fff; padding: 12px 32px; font-size: 1rem; border-radius: 999px; border: none; cursor: pointer; font-weight: 700; }
    .btn-modal:hover { background: var(--primary-dark); }

    .flip-tip {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* List modal */
    .list-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 16px;
      overflow-y: auto;
    }
    .list-backdrop.show { display: flex; }
    .list-modal {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 620px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      overflow: hidden;
      margin: auto;
    }
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 1;
    }
    .list-header h2 { font-size: 1.1rem; font-weight: 700; }
    .list-total { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .btn-close {
      background: var(--border);
      border: none;
      border-radius: 999px;
      width: 32px;
      height: 32px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .btn-close:hover { background: #cbd5e1; }
    .list-search {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
    }
    .list-search input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }
    .list-search input:focus { border-color: var(--primary); }
    .list-body { padding: 8px 0 16px; }
    .list-category-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--primary);
      text-transform: uppercase;
      padding: 12px 24px 4px;
    }
    .list-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px 24px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background 0.15s;
    }
    .list-item:hover { background: #f8fafc; }
    .list-item:last-child { border-bottom: none; }
    .list-item-term {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
    }
    .list-item-def {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .list-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 40px 24px;
    }
  /* Resume toast */
  .resume-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1A1A1C;
    color: #fff;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    transition: transform 0.35s cubic-bezier(.22,1,.36,1), opacity 0.35s;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 200;
  }
  .resume-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width: 600px) {
    header { padding: 10px 14px; flex-direction: column; align-items: flex-start; gap: 6px; }
    header h1 { font-size: 1.1rem; }
    header .subtitle { display: none; }
    .stats-bar { gap: 8px; font-size: 0.78rem; }
    .stat { padding: 3px 10px; }
    main { padding: 16px 12px 48px; }
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      gap: 8px;
    }
    .btn-secondary {
      white-space: nowrap;
      justify-content: center;
    }
  }
  </style>
</head>

// LocalStorage persistence
const STORAGE_KEY = 'vocab_progress_v1';

function saveProgress() {
  const data = {
    knownTerms: [...knownSet],
    unknownTerms: [...unknownSet],
    currentTerm: filteredCards[currentIdx]?.term,
    currentFilter
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    knownSet = new Set(data.knownTerms || []);
    unknownSet = new Set(data.unknownTerms || []);
    currentFilter = data.currentFilter || 'すべて';
    if (currentFilter === '要復習') {
      const unk = ALL_CARDS.filter(c => unknownSet.has(c.term));
      filteredCards = unk.length > 0 ? unk : [...ALL_CARDS];
      if (unk.length === 0) currentFilter = 'すべて';
    } else {
      filteredCards = currentFilter === 'すべて'
        ? [...ALL_CARDS]
        : ALL_CARDS.filter(c => c.category === currentFilter);
    }
    if (data.currentTerm) {
      const idx = filteredCards.findIndex(c => c.term === data.currentTerm);
      currentIdx = idx >= 0 ? idx : 0;
    } else {
      currentIdx = 0;
    }
    return knownSet.size + unknownSet.size > 0 || currentIdx > 0;
  } catch (e) {
    return false;
  }
}

function showResumeBanner() {
  const toast = document.getElementById('resume-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// State
let cards = [...ALL_CARDS];
let currentIdx = 0;
let isFlipped = false;
let knownSet = new Set();
let unknownSet = new Set();
let currentFilter = "すべて";
let filteredCards = [...cards];

function getCategories() {
  const cats = [...new Set(ALL_CARDS.map(c => c.category))];
  return ["すべて", ...cats];
}

function renderCategoryBar() {
  const bar = document.getElementById("category-bar");
  bar.innerHTML = "";
  getCategories().forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === currentFilter ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => setCategory(cat);
    bar.appendChild(btn);
  });
}

function setCategory(cat) {
  currentFilter = cat;
  filteredCards = cat === "すべて" ? [...ALL_CARDS] : ALL_CARDS.filter(c => c.category === cat);
  currentIdx = 0;
  resetFlip();
  renderCategoryBar();
  renderCard();
  renderProgress();
  saveProgress();
}

function renderCard() {
  if (filteredCards.length === 0) return;
  const card = filteredCards[currentIdx];
  document.getElementById("front-category").textContent = card.category;
  document.getElementById("front-term").textContent = card.term;
  document.getElementById("back-category").textContent = card.category;
  document.getElementById("back-def").textContent = card.def;
  document.getElementById("back-example").textContent = card.example || "";
  document.getElementById("card-counter").textContent = `${currentIdx + 1} / ${filteredCards.length}`;
  document.getElementById("btn-prev").disabled = currentIdx === 0;
  document.getElementById("btn-next").disabled = currentIdx === filteredCards.length - 1;
}

function renderProgress() {
  const answered = knownSet.size + unknownSet.size;
  const total = ALL_CARDS.length;
  const pct = total > 0 ? Math.round(answered / total * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-pct").textContent = pct + "%";
  document.getElementById("progress-text").textContent = `学習済み ${answered} / ${total} 問`;
  document.getElementById("stat-known").textContent = `✅ OK: ${knownSet.size}`;
  document.getElementById("stat-unknown").textContent = `❌ 要復習: ${unknownSet.size}`;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById("card").classList.toggle("flipped", isFlipped);
  document.getElementById("reaction-row").style.display = isFlipped ? "flex" : "none";
}

function resetFlip() {
  isFlipped = false;
  document.getElementById("card").classList.remove("flipped");
  document.getElementById("reaction-row").style.display = "none";
  document.getElementById("flip-tip").textContent = "タップでカードを裏返す";
}

function navigate(dir) {
  const newIdx = currentIdx + dir;
  if (newIdx < 0 || newIdx >= filteredCards.length) return;
  currentIdx = newIdx;
  resetFlip();
  renderCard();
  saveProgress();
}

function react(known) {
  const card = filteredCards[currentIdx];
  const term = card.term;
  if (known) { knownSet.add(term); unknownSet.delete(term); }
  else { unknownSet.add(term); knownSet.delete(term); }
  renderProgress();
  saveProgress();

  // Auto advance
  if (currentIdx < filteredCards.length - 1) {
    setTimeout(() => { navigate(1); }, 300);
  } else {
    // Check completion
    const answeredAll = (knownSet.size + unknownSet.size) >= filteredCards.length;
    if (answeredAll || filteredCards.every(c => knownSet.has(c.term) || unknownSet.has(c.term))) {
      showResult();
    }
  }
}

function showResult() {
  const total = filteredCards.length;
  const correct = filteredCards.filter(c => knownSet.has(c.term)).length;
  const pct = Math.round(correct / total * 100);
  document.getElementById("modal-score").textContent = pct + "%";
  let msg = pct >= 80 ? "素晴らしい！マーケティング用語をマスターしています！" :
            pct >= 50 ? "順調です！要復習の単語を重点的に練習しましょう。" :
                        "継続は力なり！毎日少しずつ復習しましょう。";
  document.getElementById("modal-msg").textContent = `OK ${correct} / ${total} 問。${msg}`;
  document.getElementById("modal-backdrop").classList.add("show");
}

function restartAll() {
  document.getElementById("modal-backdrop").classList.remove("show");
  resetProgress();
}

function resetProgress() {
  knownSet.clear();
  unknownSet.clear();
  currentIdx = 0;
  currentFilter = "すべて";
  filteredCards = [...ALL_CARDS];
  localStorage.removeItem(STORAGE_KEY);
  resetFlip();
  renderCategoryBar();
  renderCard();
  renderProgress();
}

function shuffleCards() {
  for (let i = filteredCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
  }
  currentIdx = 0;
  resetFlip();
  renderCard();
  saveProgress();
}

function filterUnknown() {
  const unk = ALL_CARDS.filter(c => unknownSet.has(c.term));
  if (unk.length === 0) { alert("要復習の単語はありません！"); return; }
  filteredCards = unk;
  currentIdx = 0;
  currentFilter = "要復習";
  resetFlip();
  renderCategoryBar();
  renderCard();
  saveProgress();
}

function openList() {
  document.getElementById("list-search-input").value = "";
  renderList();
  document.getElementById("list-backdrop").classList.add("show");
}

function closeList() {
  document.getElementById("list-backdrop").classList.remove("show");
}

function closeListOutside(e) {
  if (e.target === document.getElementById("list-backdrop")) closeList();
}

function renderList() {
  const query = document.getElementById("list-search-input").value.trim().toLowerCase();
  const filtered = ALL_CARDS.filter(c =>
    c.term.toLowerCase().includes(query) || c.def.toLowerCase().includes(query)
  );

  document.getElementById("list-total").textContent = `全 ${ALL_CARDS.length} 語中 ${filtered.length} 語表示`;

  const body = document.getElementById("list-body");
  if (filtered.length === 0) {
    body.innerHTML = '<div class="list-empty">該当する用語が見つかりません</div>';
    return;
  }

  const byCategory = {};
  filtered.forEach(c => {
    if (!byCategory[c.category]) byCategory[c.category] = [];
    byCategory[c.category].push(c);
  });

  body.innerHTML = Object.entries(byCategory).map(([cat, items]) => `
    <div class="list-category-label">${cat}</div>
    ${items.map(c => `
      <div class="list-item" onclick="jumpToCard('${c.term.replace(/'/g, "\\'")}')">
        <div class="list-item-term">${c.term}</div>
        <div class="list-item-def">${c.def}</div>
      </div>
    `).join("")}
  `).join("");
}

function jumpToCard(term) {
  const idx = ALL_CARDS.findIndex(c => c.term === term);
  if (idx === -1) return;
  currentFilter = "すべて";
  filteredCards = [...ALL_CARDS];
  currentIdx = idx;
  resetFlip();
  renderCategoryBar();
  renderCard();
  closeList();
}

// Keyboard support
document.addEventListener("keydown", e => {
  if (document.getElementById("list-backdrop").classList.contains("show")) {
    if (e.key === "Escape") closeList();
    return;
  }
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipCard(); }
  if (e.key === "ArrowRight") navigate(1);
  if (e.key === "ArrowLeft") navigate(-1);
  if (e.key === "o" || e.key === "O") react(true);
  if (e.key === "x" || e.key === "X") react(false);
});

// Init
const hasProgress = loadProgress();
renderCategoryBar();
renderCard();
renderProgress();
if (hasProgress) showResumeBanner();
</script>
</body>
</html>
